name: readease
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.0
  bcrypt: ^1.1.3
  audioplayers: ^6.1.0
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mascot/
    - assets/images/badge/
    - assets/images/words/
    - assets/images/passages/
    - assets/images/avatars/
    - assets/images/mascot/lava/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/words/
    - assets/audio/cues/
    - assets/audio/yse/
    - assets/audio/intros/
    - assets/audio/sentences/
    - assets/audio/passages/
    - assets/audio/questions/
    - assets/audio/bgm/
    - assets/data/
    - assets/icon/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF6B6B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#FDE8C8"
  image: "assets/icon/app_icon_1024.png"
  android: true
  ios: false
  android_12:
    color: "#FDE8C8"
    image: "assets/icon/app_icon_1024.png"
    icon_background_color: "#FDE8C8"